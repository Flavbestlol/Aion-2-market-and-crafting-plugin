<!doctype html>
<html><head><meta charset="utf-8"><title>stage</title>
<style>
html,body{margin:0;width:1456px;height:818px;overflow:hidden;background:#000 url(bg1.png) no-repeat 0 0}
body.bg2{background-image:url(bg2.png)}
#f{position:absolute;left:1076px;top:262px;width:360px;height:120px;border:0;background:transparent;color-scheme:normal}
#cur{position:fixed;left:0;top:0;width:22px;height:22px;z-index:99;pointer-events:none;transform-origin:2px 2px;transition:transform .08s;filter:drop-shadow(0 1px 2px rgba(0,0,0,.8))}
#cur.down{transform:scale(.86)}
.ring{position:fixed;z-index:98;width:34px;height:34px;margin:-17px 0 0 -17px;border:2px solid #f2c35b;border-radius:50%;pointer-events:none;animation:ping .5s ease-out forwards}
@keyframes ping{from{transform:scale(.35);opacity:1}to{transform:scale(1.3);opacity:0}}
#cap{position:fixed;left:832px;top:270px;width:224px;z-index:97;pointer-events:none;box-sizing:border-box;padding:11px 14px 12px;border-radius:12px;
  background:linear-gradient(180deg,rgba(14,16,22,.9),rgba(8,10,14,.92));border:1px solid rgba(242,195,91,.55);box-shadow:0 6px 22px rgba(0,0,0,.55);
  font-family:Inter,system-ui,sans-serif;color:#ece4d0;opacity:0;transform:translateY(6px);transition:opacity .25s,transform .25s}
#cap.on{opacity:1;transform:none}
#cap b{display:block;font-size:16px;line-height:1.25;font-weight:600;color:#ffe7a6}
#cap span{display:block;margin-top:5px;font-size:12.5px;line-height:1.35;color:#c9c2b2}
#cap span:empty{display:none}
</style></head>
<body>
<iframe id="f" src="ui/shop.html" allowtransparency="true"></iframe>
<svg id="cur" viewBox="0 0 22 22"><path d="M2 2 L2 18 L6.5 14 L9.5 20.5 L12.3 19.3 L9.4 12.9 L15.5 12.9 Z" fill="#fff" stroke="#111" stroke-width="1.3" stroke-linejoin="round"/></svg>
<div id="cap"><b></b><span></span></div>
<script>
const cur = document.getElementById('cur'), cap = document.getElementById('cap');
window.__cur = (x, y) => { cur.style.left = x - 2 + 'px'; cur.style.top = y - 2 + 'px'; };
window.__down = (on, x, y) => {
  cur.classList.toggle('down', on);
  if (on) { const r = document.createElement('div'); r.className = 'ring'; r.style.left = x + 'px'; r.style.top = y + 'px'; document.body.append(r); setTimeout(() => r.remove(), 600); }
};
window.__cap = (t, s) => {
  if (!t) { cap.classList.remove('on'); return; }
  const show = () => { cap.querySelector('b').textContent = t; cap.querySelector('span').textContent = s || ''; cap.classList.add('on'); };
  if (cap.classList.contains('on')) { cap.classList.remove('on'); setTimeout(show, 200); } else show();
};
window.__cur(1250, 700);
document.addEventListener('mousemove', (e) => window.__cur(e.clientX, e.clientY));
document.addEventListener('mousedown', (e) => window.__down(true, e.clientX, e.clientY));
document.addEventListener('mouseup', (e) => window.__down(false, e.clientX, e.clientY));
</script>
</body></html>
